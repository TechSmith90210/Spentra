spring.application.name=backend
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Keep receipt uploads small enough for low-memory production instances. Receipt
# parsing Base64-encodes the file, which temporarily expands it in JVM heap.
# The request allowance includes multipart framing so a 2 MB file remains valid.
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:2MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:3MB}

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:2592000000}

# CORS Configuration
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:}
GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:}

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-1.5-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
